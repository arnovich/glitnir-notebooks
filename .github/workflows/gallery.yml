name: Notebook gallery

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      glitnir_tag:
        description: Glitnir release tag to use, such as v0.1.10 (default the latest published release)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: gallery-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22.22.2'
          cache: npm
      - name: Resolve the Glitnir release
        id: glitnir
        env:
          GH_TOKEN: ${{ github.token }}
          GLITNIR_TAG: ${{ inputs.glitnir_tag }}
        run: |
          tag=$(python -m scripts.glitnir_release --tag "$GLITNIR_TAG" --output "$RUNNER_TEMP/glitnir-requirements.txt")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Glitnir release $tag"
      - name: Install the export tools from that release
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/glitnir-requirements.txt" -r scripts/gallery/requirements.txt
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Test gallery and bundle guards
        run: |
          python -m unittest discover -s tests -v
          python scripts/check_bundles.py
          python scripts/check_triptych.py releases/proved-refuted-unknown.json
          npm test
      - name: Check the walkthroughs against their originals (text only; unchecked)
        env:
          REQUIRE_WALKTHROUGH_HELPER: '1'
        run: |
          python scripts/fetch_originals.py
          python -m unittest discover -s tests -p test_walkthroughs.py -v
          python scripts/check_walkthroughs.py
      # Every published diagram is recorded in its notebook bundle. Static
      # export reuses those drawings only when source/provider hashes match.
      # No private Lake dependencies are fetched by the public gallery job;
      # missing/stale drawings fail export and need a maintainer refresh.
      - name: Restore unchanged diagrams
        uses: actions/cache@v5
        with:
          path: .gallery-cache
          key: gallery-diagrams-${{ runner.os }}-${{ steps.glitnir.outputs.tag }}-${{ hashFiles('lake-manifest.json', 'public/lake-manifest.json', 'examples/**/*.lean', 'public/examples/**/*.lean') }}
          restore-keys: gallery-diagrams-${{ runner.os }}-
      - name: Export saved notebooks and results without checking claims
        env:
          # EnergyOptimization's optimized circuit needs more than Glitnir's
          # default 8 GB Lean memory limit to draw; the runner has 16 GB.
          GLITNIR_MEMORY_LIMIT_MB: '12288'
        run: python -m scripts.build_gallery
      - name: Verify every exported page and create preview images
        run: npm run gallery:check -- _site
      - name: Ensure no source or metadata was changed
        run: git diff --exit-code -- examples public/examples walkthroughs
      - name: Upload browsable preview
        uses: actions/upload-artifact@v6
        with:
          name: notebook-gallery
          path: _site
          retention-days: 14
      - name: Package the public Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.repository.private
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.repository.private
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Publish the gallery
        id: deployment
        uses: actions/deploy-pages@v5
